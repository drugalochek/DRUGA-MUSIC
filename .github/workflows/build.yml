name: Build SONORA

on:
  push:
    branches: [ main, sonora-sonicwave-desktop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Generate SONORA icon from repository artwork
        shell: pwsh
        run: ./scripts/create-icon.ps1
      - name: Restore
        run: dotnet restore DrugaMusic.sln
      - name: Build
        run: dotnet build DrugaMusic.sln --configuration Release --no-restore
      - name: Publish self-contained Windows x64 app
        if: github.event_name != 'pull_request'
        run: dotnet publish DrugaMusic/DrugaMusic.csproj --configuration Release --runtime win-x64 --self-contained true /p:PublishSingleFile=true --output publish
      - name: Upload Windows build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SONORA-Windows-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14
